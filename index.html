<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schatzsuche</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section id="language-page">
            <header class="hero">
                <h1>🌱 Schatzsuche</h1>
                <p class="subtitle">Menschen sehen. Talente entdecken. Gemeinschaft stärken.</p>
                <p class="welcome">
                    Jeder Mensch bringt Fähigkeiten, Erfahrungen und Talente mit.
                    Gemeinsam möchten wir die Schätze unserer Gemeinschaft sichtbar machen.
                </p>
            </header>

            <h2 id="language-heading">Sprache wählen</h2>

            <div class="language-grid">
                <button class="card" data-language="de"><div class="flags">🇩🇪</div><div class="language-name">Deutsch</div></button>
                <button class="card" data-language="en"><div class="flags">🇬🇧 🇺🇸 🇳🇬</div><div class="language-name">English</div></button>
                <button class="card" data-language="fr"><div class="flags">🇫🇷 🇨🇲 🇹🇬 🇧🇯</div><div class="language-name">Français</div></button>
                <button class="card" data-language="ar"><div class="flags">🇸🇾 🇱🇧 🇯🇴 🇵🇸</div><div class="language-name">العربية</div></button>
                <button class="card" data-language="uk"><div class="flags">🇺🇦</div><div class="language-name">Українська</div></button>
                <button class="card" data-language="tr"><div class="flags">🇹🇷</div><div class="language-name">Türkçe</div></button>
                <button class="card" data-language="vi"><div class="flags">🇻🇳</div><div class="language-name">Tiếng Việt</div></button>
                <button class="card" data-language="ru"><div class="flags">🇷🇺</div><div class="language-name">Русский</div></button>
            </div>

            <div class="continue-area">
                <button id="continue-button" class="continue-button" hidden>Weiter</button>
            </div>
        </section>

        <section id="about-page" hidden>
            <h1 id="about-title">Über mich</h1>

            <form class="about-form">
                <label for="name" id="name-label">Name</label>
                <input id="name" name="name" type="text" autocomplete="name">

                <label for="city" id="city-label">Stadt</label>
                <input id="city" name="city" type="text" autocomplete="address-level2">

                <label for="country" id="country-label">Herkunftsland</label>
                <input id="country" name="country" type="text">

                <label for="mother-language" id="mother-language-label">Muttersprache</label>
                <input id="mother-language" name="mother-language" type="text">

                <label for="other-languages" id="other-languages-label">Weitere Sprachen</label>
                <input id="other-languages" name="other-languages" type="text">
            </form>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
