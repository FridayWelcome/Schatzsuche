<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schatzsuche</title>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 800px;
  margin: auto;
  padding: 20px;
  background: #f8f9fa;
}

h1 {
  color: #2c3e50;
}

.languages {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.lang {
  background: white;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 15px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>🌱 Schatzsuche</h1>

<p>
Menschen sehen. Talente entdecken. Gemeinschaft stärken.
</p>

<h2>Sprache wählen</h2>

<div class="languages">
  <div class="lang">🇩🇪 Deutsch</div>
  <div class="lang">🇬🇧 English</div>
  <div class="lang">🇸🇾 العربية</div>
  <div class="lang">🇺🇦 Українська</div>
  <div class="lang">🇹🇷 Türkçe</div>
</div>

</body>
</html>
